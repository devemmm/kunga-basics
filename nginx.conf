server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── App Links / Universal Links verification files ────────────────────────
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }
    location = /.well-known/assetlinks.json {
        default_type application/json;
    }

    # ── Proxy API calls → kunga-api (used for visitor analytics tracking) ────
    # Use Docker's embedded DNS (127.0.0.11) with a variable in proxy_pass so
    # nginx re-resolves kunga-api on every request instead of caching the IP
    # at config-load time. Without this, a kunga-api container restart (which
    # gets a new bridge-network IP) leaves nginx pointing at a dead IP until
    # a manual `nginx -s reload`.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $kunga_api_upstream http://kunga-api:3001;
        proxy_pass         $kunga_api_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    # ── Cache hashed static assets (JS/CSS bundles have content hashes) ───────
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires    30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── index.html — never cache so browsers always get latest bundle refs ────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── SPA fallback — serve index.html for all non-file routes ──────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
